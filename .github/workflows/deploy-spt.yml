name: Build and Deploy to GCP SPT (Staging)

on:
  push:
    branches:
      - 'release/*'
      - 'release/**'
  pull_request:
    types:
      - closed
    branches:
      - 'release/**'
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: 'p-np-spt-de'
  GAR_LOCATION: 'us-west1'
  REPOSITORY: 'soundboard-app-spt'
  IMAGE_NAME: 'app'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/304516994920/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
  SERVICE_ACCOUNT: 'sa-gha-ar-pusher-spt@p-np-spt-de.iam.gserviceaccount.com'
  CLOUD_RUN_SERVICE: 'soundboard-app-fb-spt'

jobs:
  build-and-push-spt:
    name: Build & Push Image to SPT Artifact Registry
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          docker build -t "${IMAGE_URI}:${{ github.sha }}" -t "${IMAGE_URI}:latest" .

      - name: Push Docker Image to Artifact Registry
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          docker push "${IMAGE_URI}:${{ github.sha }}"
          docker push "${IMAGE_URI}:latest"

      - name: Deploy to Cloud Run (Base App)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'soundboard-app-fb-spt'
          region: ${{ env.GAR_LOCATION }}
          image: '${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'

      - name: Deploy to Cloud Run (Sina)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'soundboard-user-sina-spt'
          region: ${{ env.GAR_LOCATION }}
          image: '${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'

      - name: Deploy to Cloud Run (Cesar)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'soundboard-user-cesar-spt'
          region: ${{ env.GAR_LOCATION }}
          image: '${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
