version: '3.8'

services:
  soundboard:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # Mount the audio directory so you can add/remove sounds without rebuilding
      - ./static/audio:/app/static/audio:ro
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
