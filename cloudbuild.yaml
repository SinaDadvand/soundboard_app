steps:
  # 1. Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/soundboard-app:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/soundboard-app:latest'
      - '.'

  # 2. Push container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/soundboard-app:$COMMIT_SHA'

  # 3. Deploy to GCP Cloud Run with Zero-Cost Settings
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'soundboard-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/soundboard-app:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--port'
      - '8080'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '1'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--cpu-throttling'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/soundboard-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/soundboard-app:latest'
